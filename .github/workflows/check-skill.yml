name: Check resume skill

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "agents/**"
      - "references/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "resume.cls"
      - "fontawesome*"
      - "fonts/**"
      - ".github/workflows/check-skill.yml"
  pull_request:
    paths:
      - "SKILL.md"
      - "agents/**"
      - "references/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - "resume.cls"
      - "fontawesome*"
      - "fonts/**"
      - ".github/workflows/check-skill.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: brew install tectonic poppler
      - name: Test data and renderer behavior
        run: python3 -m unittest discover -s tests -v
      - name: Check recorded conversation structure and references
        run: python3 scripts/check_conversation_evals.py
      - name: Validate and synchronize fictional fact versions
        run: |
          python3 scripts/facts.py check assets/examples/fact-workspace.json
          python3 scripts/facts.py sync assets/examples/fact-workspace.json --out "$RUNNER_TEMP/resume-fact-review"
      - name: Build bilingual examples in both themes
        shell: bash
        run: |
          for language in zh en; do
            for theme in classic plain; do
              python3 scripts/resume.py render "assets/examples/$language.json" \
                --out "$RUNNER_TEMP/resume-review/$language-$theme" --theme "$theme" --pdf
              python3 scripts/resume.py check "$RUNNER_TEMP/resume-review/$language-$theme"
            done
          done
      - name: Import actual PDFs and rebuild editable drafts
        shell: bash
        run: |
          for language in zh en; do
            python3 scripts/import_resume.py "$RUNNER_TEMP/resume-review/$language-plain/resume.pdf" \
              --out "$RUNNER_TEMP/resume-import/$language" --language "$language"
            for theme in classic plain; do
              python3 scripts/resume.py render "$RUNNER_TEMP/resume-import/$language/resume.json" \
                --out "$RUNNER_TEMP/resume-review/import-$language-$theme" --theme "$theme" --draft --pdf
              python3 scripts/resume.py check "$RUNNER_TEMP/resume-review/import-$language-$theme" --draft
            done
          done
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skill-example-review
          path: |
            ${{ runner.temp }}/resume-review/**/*.pdf
            ${{ runner.temp }}/resume-review/**/qa.json
            ${{ runner.temp }}/resume-review/**/resume-extracted.txt
            ${{ runner.temp }}/resume-review/**/build.log
